name: Ses - klon kaydını yazıya dök (gizli)

# Gizli depodaki klon kaydını (volt-istatistik/klon/<konu>/klon.m4a) kelime kelime yazıya döker,
# sonucu yine gizli depoya (klon/<konu>/transkript.json) yazar. Açık depoya ses/metin yazılmaz.
on:
  workflow_dispatch:
    inputs:
      konu:
        description: "volt-istatistik/klon/<konu>"
        required: true

permissions:
  contents: read

jobs:
  incele:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3
      - name: Kur
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          pip install -q faster-whisper
      - name: Yazıya dök ve gizli depoya kaydet
        env:
          GT: ${{ secrets.ISTATISTIK_TOKEN }}
        run: |
          K="${{ github.event.inputs.konu }}"
          case "$K" in *[!a-z0-9-]*|"") echo "geçersiz konu"; exit 1;; esac
          git clone -q "https://x-access-token:${GT}@github.com/ridakgokhan-max/volt-istatistik.git" /tmp/gizli
          S=/tmp/gizli/klon/$K/klon.m4a
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$S")
          python scripts/ses_incele.py "$S" "0-$D" /tmp/gizli/klon/$K/transkript.json
          cd /tmp/gizli
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add -A && git commit -qm "Klon transkript: $K" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done

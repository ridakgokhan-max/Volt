name: Görsel modeli testi 2

on:
  push:
    branches: [main]
    paths:
      - "scripts/image_test2.py"
      - ".github/workflows/gorsel-test2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yer aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd15-lcm-v1
      - name: Paketleri kur
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors peft
      - name: Görselleri üret
        run: |
          mkdir -p out/gorsel-test2
          set -o pipefail
          python scripts/image_test2.py 2>&1 | grep -v Warning | tail -n 80 | tee out/gorsel-test2/log.txt
          free -h | tee -a out/gorsel-test2/log.txt
      - name: Sonucu depoya kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          echo "durum: ${{ job.status }}" >> out/gorsel-test2/log.txt
          git add out/gorsel-test2
          git commit -m "Görsel testi 2 sonucu [skip ci]" || echo "Değişiklik yok"
          git pull --rebase -q && git push

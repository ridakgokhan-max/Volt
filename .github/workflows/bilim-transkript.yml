name: Bilim - sesi yazıya dök

# bilim/<konu>/ses.m4a yüklenince kaydı kelime kelime zamanlı yazıya döker (faster-whisper)
on:
  push:
    branches: [main]
    paths:
      - "bilim/*/ses.*"
  workflow_dispatch:
    inputs:
      konu:
        description: "bilim/ altındaki klasör adı (boşsa yeni kayıtların hepsi)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: bilim-transkript
  cancel-in-progress: false

jobs:
  transkript:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3
      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper
      - name: Yazıya dök
        run: |
          set -o pipefail
          python scripts/transkript.py "${{ github.event.inputs.konu }}" 2>&1 | tee /tmp/transkript.log
      - name: Sonucu depoya kaydet
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add bilim/*/kelimeler.json
          git commit -m "Ses yazıya döküldü [skip ci]" || echo "Değişiklik yok"
          git pull --rebase && git push

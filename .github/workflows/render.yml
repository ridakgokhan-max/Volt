name: Videoyu üret

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/render.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paketleri kur
        run: npm install --no-audit --no-fund
      - name: Videoyu üret
        run: npx remotion render src/index.ts Test out/test.mp4 --log=info
      - name: Videoyu depoya kaydet
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add out/
          git commit -m "Video üretildi [skip ci]" || echo "Değişiklik yok"
          git push

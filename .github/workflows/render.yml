name: Videoyu üret

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/tts.py"
      - "scenes.json"
      - "public/**"
      - "package.json"
      - ".github/workflows/render.yml"
      - "!src/bilim/**"
      - "!public/bilim/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts
          npm install --no-audit --no-fund
      - name: Sesi ve altyazı zamanlamasını üret
        run: |
          mkdir -p out
          set -o pipefail
          python scripts/tts.py 2>&1 | tee out/log.txt
      - name: Videoyu üret
        run: |
          set -o pipefail
          npx remotion render src/index.ts Kuantum out/kuantum.mp4 --log=info 2>&1 | tail -n 150 | tee -a out/log.txt
      - name: Sonucu depoya kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          echo "durum: ${{ job.status }}" >> out/log.txt
          git add out/ src/timeline.json
          git commit -m "Video üretildi [skip ci]" || echo "Değişiklik yok"
          git push

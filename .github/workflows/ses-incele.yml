name: Ses - şüpheli yerleri incele (kekeleme/tekrar)

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "bilim/<konu>/ses.* incelenir"
        required: true
      araliklar:
        description: "a-b;a-b (saniye)"
        required: true

permissions:
  contents: write

jobs:
  incele:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3
      - name: Araçları kur
        run: |
          if ! command -v ffmpeg >/dev/null; then
            (timeout 180 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg > /dev/null) || {
              pip install -q imageio-ffmpeg
              sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg; }
          fi
          pip install -q faster-whisper
      - name: İncele
        run: |
          K="${{ github.event.inputs.konu }}"
          S=$(ls bilim/$K/ses.* | head -1)
          python scripts/ses_incele.py "$S" "${{ github.event.inputs.araliklar }}" "bilim/$K/ses_inceleme.json"
      - name: Kaydet
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add bilim/*/ses_inceleme.json
          git commit -m "Ses incelemesi [skip ci]" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done

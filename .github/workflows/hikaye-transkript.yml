name: Hikâye - sesi yazıya dök

# hikaye/<ad>/ses.m4a yüklenince kaydı kelime kelime zamanlı yazıya döker (faster-whisper)
on:
  push:
    branches: [main]
    paths:
      - "hikaye/*/ses.*"
  workflow_dispatch:
    inputs:
      konu:
        description: "hikaye/ altındaki klasör adı (boşsa yeni kayıtların hepsi)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: hikaye-transkript
  cancel-in-progress: false

jobs:
  transkript:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3
      - name: Araçları kur
        run: |
          if ! command -v ffmpeg >/dev/null; then
            (timeout 180 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg > /dev/null) || {
              echo "apt takıldı, ffmpeg pip'ten kuruluyor"; pip install -q imageio-ffmpeg
              sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg; }
          fi
          pip install -q faster-whisper
      - name: Yazıya dök
        run: |
          mkdir -p hikaye/_log
          set -o pipefail
          python scripts/hikaye_transkript.py "${{ github.event.inputs.konu }}" 2>&1 | tee hikaye/_log/transkript.log
      - name: Sonucu depoya kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add hikaye/_log/transkript.log || true
          git add hikaye/*/kelimeler.json 2>/dev/null || true
          git commit -m "Hikâye sesi yazıya döküldü [skip ci]" || echo "Değişiklik yok"
          git pull --rebase && git push

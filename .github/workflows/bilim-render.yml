name: Bilim - videoyu üret

# Kurgu (ses temizleme, boşluk silme, efekt+müzik) + Remotion render
on:
  push:
    branches: [main]
    paths:
      - "src/bilim/**"
      - "bilim/*/kurgu.json"
      - "bilim/*/sesler.py"
  workflow_dispatch:
    inputs:
      konu:
        description: "bilim/ altındaki klasör adı (src/bilim/aktif.ts ile aynı)"
        required: false
        default: ""
      platform:
        description: "instagram | tiktok | shorts | hepsi"
        required: false
        default: "instagram"
      taslak:
        description: "evet = sadece taslak (sahne kareleri) üret, tam video yok"
        required: false
        default: "hayir"

permissions:
  contents: write

concurrency:
  group: bilim-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow
          npm install --no-audit --no-fund
      - name: Konuyu belirle
        id: konu
        run: |
          K="${{ github.event.inputs.konu }}"
          if [ -z "$K" ]; then K=$(git diff --name-only HEAD~1 HEAD | grep -oP '^bilim/\K[^/]+(?=/)' | head -1); fi
          if [ -z "$K" ]; then K=demo; fi
          echo "konu=$K" >> $GITHUB_OUTPUT
          mkdir -p out/bilim
      - name: Müzik kütüphanesi (gizli depodan, Pixabay)
        env:
          GT: ${{ secrets.ISTATISTIK_TOKEN }}
        run: git clone -q --depth 1 "https://x-access-token:${GT}@github.com/ridakgokhan-max/volt-istatistik.git" /tmp/gizli || echo "müzik kütüphanesi alınamadı, sentez müzik kullanılacak"
      - name: Kurgu (ses, altyazı zamanı, efekt, müzik)
        run: |
          set -o pipefail
          python scripts/bilim_kurgu.py "${{ steps.konu.outputs.konu }}" 2>&1 | tee out/bilim/log.txt
      - name: Taslak (sahne kareleri, onay için)
        if: github.event.inputs.taslak == 'evet'
        run: |
          set -o pipefail
          K="${{ steps.konu.outputs.konu }}"
          node scripts/taslak.mjs "$K" 2>&1 | grep -E "kare:|Error|error" | tee -a out/bilim/log.txt
          python scripts/taslak_pafta.py "$K" | tee -a out/bilim/log.txt
          rm -rf out/bilim/taslak
      - name: Videoyu üret
        if: github.event.inputs.taslak != 'evet'
        run: |
          set -o pipefail
          K="${{ steps.konu.outputs.konu }}"
          P="${{ github.event.inputs.platform }}"
          [ -z "$P" ] && P=instagram
          [ "$P" = "hepsi" ] && P="instagram tiktok shorts"
          for PL in $P; do
            AD="$K"; [ "$PL" != "instagram" ] && AD="$K-$PL"
            npx remotion render src/index.ts Bilim "out/bilim/$AD.mp4" --props="{\"konu\":\"$K\",\"platform\":\"$PL\"}" --log=info 2>&1 | grep -v -E "^Rendered|^Encoded" | tail -n 40 | tee -a out/bilim/log.txt
          done
      - name: Kapak ve kontrol kareleri
        if: always()
        run: |
          K="${{ steps.konu.outputs.konu }}"
          npx remotion still src/index.ts BilimKapak "out/bilim/$K-kapak.png" --props="{\"konu\":\"$K\"}" --log=error || true
          if [ -f "out/bilim/$K.mp4" ]; then
            ffmpeg -y -loglevel error -i "out/bilim/$K.mp4" -vf "fps=1/2,scale=216:384,tile=6x4" -frames:v 1 "out/bilim/$K-kareler.jpg" || true
          fi
      - name: Sonucu depoya kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          echo "durum: ${{ job.status }}" >> out/bilim/log.txt
          git add out/bilim public/bilim src/bilim/data || true
          git commit -m "Bilim videosu üretildi [skip ci]" || echo "Değişiklik yok"
          git pull --rebase && git push

name: Instagram - yorumlar (cevaplar onaylı)

# cek: yorumları gizli depoya çeker (her gün otomatik de çalışır).
# yanitla: SADECE Kadir'in onayladığı cevapları gönderir; elle başlatılır.
on:
  schedule:
    - cron: "25 6 * * *"   # her gün 09:25 (Türkiye) — sadece çekme
  workflow_dispatch:
    inputs:
      islem:
        description: "cek veya yanitla"
        required: true
        default: "cek"
      yorum_id:
        description: "yanitla: cevaplanacak yorum id (isteğe bağlı)"
        required: false
        default: ""
      metin:
        description: "yanitla: Kadir'in onayladığı cevap metni (isteğe bağlı)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  yorum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gizli depoyu al
        env:
          GT: ${{ secrets.ISTATISTIK_TOKEN }}
        run: git clone -q "https://x-access-token:${GT}@github.com/ridakgokhan-max/volt-istatistik.git" /tmp/gizli
      - name: Çalıştır
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          ISTATISTIK_KLASOR: /tmp/gizli
          YID: ${{ github.event.inputs.yorum_id }}
          METIN: ${{ github.event.inputs.metin }}
        run: |
          I="${{ github.event.inputs.islem }}"; [ -z "$I" ] && I=cek
          if [ "$I" = yanitla ] && [ -n "$YID" ] && [ -n "$METIN" ]; then
            python3 - <<'PY'
          import json, os
          yol = os.path.join(os.environ["ISTATISTIK_KLASOR"], "yanitlar.json")
          l = json.load(open(yol, encoding="utf-8")) if os.path.exists(yol) else []
          l.append({"yorum_id": os.environ["YID"], "metin": os.environ["METIN"], "onay": True})
          json.dump(l, open(yol, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
          fi
          python3 scripts/instagram_yorum.py "$I" 2>&1 | sed -E 's/access_token=[^&" ]+/access_token=***/g'
      - name: Gizli depoya kaydet
        if: always()
        run: |
          cd /tmp/gizli
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add -A && git commit -qm "Yorumlar $(date +%F_%H%M)" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done

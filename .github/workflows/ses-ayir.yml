name: Ses - konuşmayı müzikten ayır

# bilim/<konu>/ses.* içindeki konuşmayı arka plan müziğinden ayırır (Demucs, MIT lisans).
# Çıktı: bilim/<konu>/konusma.wav
on:
  workflow_dispatch:
    inputs:
      konu:
        description: "bilim/<konu>/ses.* ayrılır"
        required: true

permissions:
  contents: write

jobs:
  ayir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kur
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio demucs soundfile 2>&1 | tail -3
      - name: Ayır
        run: |
          K="${{ github.event.inputs.konu }}"
          S=$(ls bilim/$K/ses.* | head -1)
          ffmpeg -y -loglevel error -i "$S" -ac 2 -ar 44100 /tmp/girdi.wav
          python -m demucs --two-stems=vocals -n htdemucs -o /tmp/ayir /tmp/girdi.wav
          cp /tmp/ayir/htdemucs/girdi/vocals.wav bilim/$K/konusma.wav
      - name: Kaydet
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add bilim/${{ github.event.inputs.konu }}/konusma.wav
          git commit -qm "Konuşma ayrıldı [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done

name: Instagram - günlük istatistik

# Veriler GİZLİ depoya (ridakgokhan-max/volt-istatistik) yazılır; bu açık depoya sadece kısa kayıt düşer.
on:
  schedule:
    - cron: "17 6 * * *"   # her gün 09:17 (Türkiye)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gizli depoyu al
        env:
          GT: ${{ secrets.ISTATISTIK_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${GT}@github.com/ridakgokhan-max/volt-istatistik.git" /tmp/gizli
      - name: İstatistikleri çek
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          ISTATISTIK_KLASOR: /tmp/gizli
        run: |
          mkdir -p istatistik
          python3 scripts/instagram_istatistik.py 2>&1 | tee istatistik/log.txt
      - name: Anahtarın süresini uzat (60 gün)
        if: always()
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: curl -s -o /dev/null "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$INSTAGRAM_TOKEN" || true
      - name: Gizli depoya kaydet
        run: |
          cd /tmp/gizli
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add -A && git commit -qm "İstatistik $(date +%F)" || true
          git push -q
      - name: Kısa kayıt (açık depo)
        if: always()
        run: |
          echo "durum: ${{ job.status }} $(date +%F)" >> istatistik/log.txt
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add istatistik/log.txt || true
          git commit -m "Instagram istatistik kaydı [skip ci]" || true
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

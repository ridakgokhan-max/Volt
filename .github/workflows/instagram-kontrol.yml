name: Instagram - izin kontrolü

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paylaşım izni ve kota
        env:
          T: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          mkdir -p istatistik
          {
            echo "tarih: $(date -u +%FT%TZ)"
            echo "hesap: $(curl -s "https://graph.instagram.com/v22.0/me?fields=username,account_type&access_token=$T")"
            echo "paylasim_kotasi: $(curl -s "https://graph.instagram.com/v22.0/me/content_publishing_limit?fields=quota_usage,config&access_token=$T")"
          } | sed -E 's/access_token=[^&" ]+/access_token=***/g' | tee istatistik/izin_kontrol.txt
      - name: Kaydet
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add istatistik/izin_kontrol.txt && git commit -qm "Instagram izin kontrolü [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done

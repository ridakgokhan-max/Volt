name: Remotion - tek kompozisyon üret

# Deneme/önizleme kompozisyonlarını (ör. CtaDemo) üretir: out/bilim/<cikti>.mp4
on:
  workflow_dispatch:
    inputs:
      kompozisyon:
        description: "Root.tsx içindeki Composition id (ör. CtaDemo)"
        required: true
      cikti:
        description: "çıktı dosya adı (uzantısız)"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npm install --no-audit --no-fund
      - name: Üret
        run: |
          mkdir -p out/bilim
          npx remotion render src/index.ts "${{ github.event.inputs.kompozisyon }}" "out/bilim/${{ github.event.inputs.cikti }}.mp4" --log=error
      - name: Kaydet
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add out/bilim/${{ github.event.inputs.cikti }}.mp4
          git commit -m "Önizleme üretildi [skip ci]" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done

name: Ses kütüphanesi - CC0 sesleri indir

# Sadece CC0 (kamu malı) ses paketlerini sesler/ klasörüne indirir ve kataloglar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ses_indir.py"
      - "scripts/ses_katalog.py"

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: İndir ve katalogla
        run: |
          mkdir -p sesler
          set -o pipefail
          (python scripts/ses_indir.py && python scripts/ses_katalog.py) 2>&1 | tee sesler/indirme.log
      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add sesler
          git commit -m "Ses kütüphanesi güncellendi (CC0) [skip ci]" || echo "Değişiklik yok"
          git pull --rebase && git push

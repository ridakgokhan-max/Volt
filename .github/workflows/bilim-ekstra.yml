name: Bilim - derinlik katmanları ve Blender sahnesi

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "çıktıların gideceği bilim/ klasörü"
        required: true
      derinlik:
        description: "katmanlara ayrılacak görsel (public/ altından yol, boşsa atla)"
        required: false
        default: ""
      blender:
        description: "çalıştırılacak Blender betiği (scripts/ altından, boşsa atla)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  derinlik:
    if: ${{ github.event.inputs.derinlik != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-depth-anything-v2-small
      - name: Kur
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers pillow numpy
      - name: Katmanlara ayır
        run: |
          K="${{ github.event.inputs.konu }}"
          SRC="public/${{ github.event.inputs.derinlik }}"
          AD=$(basename "$SRC" .jpg)
          mkdir -p public/bilim/$K
          python scripts/derinlik.py "$SRC" "public/bilim/$K/$AD"
      - name: Kaydet
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add public/bilim
          git commit -m "Derinlik katmanları [skip ci]" || echo "yok"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
  blender:
    if: ${{ github.event.inputs.blender != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.3
      - name: Blender kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libxxf86vm1 libxfixes3 > /dev/null
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender && curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ -C ~/blender --strip-components=1
          fi
          ~/blender/blender --version | head -1
      - name: Render
        run: |
          K="${{ github.event.inputs.konu }}"
          B="${{ github.event.inputs.blender }}"
          AD=$(basename "$B" .py)
          mkdir -p /tmp/kare public/bilim/$K
          ~/blender/blender -b -P "scripts/$B" -- /tmp/kare 120 2>&1 | grep -E "Fra:|bitti|Error|error" | tail -n 30
          ffmpeg -y -loglevel error -framerate 30 -i /tmp/kare/k_%04d.png -c:v libx264 -pix_fmt yuv420p -crf 18 "public/bilim/$K/$AD.mp4"
          ls -la public/bilim/$K
      - name: Kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add public/bilim || true
          git commit -m "Blender sahnesi [skip ci]" || echo "yok"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

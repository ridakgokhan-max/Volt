name: Pixabay müzik indir (gizli depoya)

# Pixabay Music lisansı ham dosyaların tek başına dağıtılmasına izin vermediği için
# parçalar açık Volt deposuna değil, gizli volt-istatistik deposuna (muzik/<duygu>/) kaydedilir.
on:
  workflow_dispatch:
    inputs:
      liste:
        description: "her satır: duygu|https://pixabay.com/music/... (satırlar ; ile de ayrılabilir)"
        required: true

permissions:
  contents: read

jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - name: Gizli depoyu al
        env:
          GT: ${{ secrets.ISTATISTIK_TOKEN }}
        run: git clone -q "https://x-access-token:${GT}@github.com/ridakgokhan-max/volt-istatistik.git" /tmp/gizli
      - name: İndir
        env:
          LISTE: ${{ github.event.inputs.liste }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          K=/tmp/gizli/muzik/katalog.tsv
          mkdir -p /tmp/gizli/muzik; touch "$K"
          echo "$LISTE" | tr ';' '\n' | while IFS='|' read -r DUYGU SAYFA; do
            DUYGU=$(echo "$DUYGU" | tr -cd 'a-z0-9-'); [ -z "$DUYGU" ] && continue
            case "$SAYFA" in https://pixabay.com/music/*) ;; *) echo "atlandı: $SAYFA"; continue;; esac
            AD=$(basename "$SAYFA" | tr -cd 'a-z0-9-')
            if grep -q "$AD" "$K"; then echo "zaten var: $AD"; continue; fi
            HTML=$(curl -sSL -A "$UA" "$SAYFA" </dev/null || true)
            MP3=$(echo "$HTML" | grep -oE 'https://cdn\.pixabay\.com/(download/)?audio/[^"\\ ]+\.mp3[^"\\ ]*' | head -1)
            if [ -z "$MP3" ]; then echo "BULUNAMADI: $AD (sayfa $(echo "$HTML" | wc -c) bayt)"; continue; fi
            mkdir -p "/tmp/gizli/muzik/$DUYGU"
            curl -sSfL -A "$UA" -e "$SAYFA" -o "/tmp/gizli/muzik/$DUYGU/$AD.mp3" "$MP3" </dev/null && \
              printf "%s\t%s\t%s\t%s\n" "$DUYGU" "$AD" "$SAYFA" "Pixabay Content License" >> "$K" && echo "indirildi: $DUYGU/$AD"
          done
      - name: Kaydet
        run: |
          cd /tmp/gizli
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add muzik
          git commit -qm "Pixabay müzikleri eklendi" || true
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 4; done

name: Lottie - animasyon indir

on:
  workflow_dispatch:
    inputs:
      liste:
        description: "boşlukla ayrılmış ad=url çiftleri"
        required: true

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İndir
        run: python3 scripts/lottie_indir.py ${{ github.event.inputs.liste }} 2>&1 | tee public/lottie_log.txt
      - name: Kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add public/lottie public/lottie_log.txt || true
          git commit -m "Lottie animasyonları [skip ci]" || true
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

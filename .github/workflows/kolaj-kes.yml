name: kolaj-kes
on:
  workflow_dispatch:
    inputs:
      klasor:
        description: "Çıktı klasörü (public/bilim/<klasor>)"
        required: true
      liste:
        description: "ad|kaynak_yolu;ad|kaynak_yolu;..."
        required: true
permissions:
  contents: write
jobs:
  kes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Kur
        run: pip install -q "rembg[cpu]" pillow numpy
      - name: Kes
        env:
          KL: ${{ inputs.klasor }}
          LS: ${{ inputs.liste }}
        run: |
          IFS=';' read -ra ARGS <<< "$LS"
          python3 scripts/kolaj_kes.py "public/bilim/$KL" "${ARGS[@]}"
      - name: Kaydet
        env:
          KL: ${{ inputs.klasor }}
        run: |
          git config user.name "volt-bot"; git config user.email "volt-bot@users.noreply.github.com"
          git add "public/bilim/$KL"
          git commit -m "kolaj parçaları: $KL [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done

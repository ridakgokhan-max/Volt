name: Bilim - yapay zekâ ile seslendir (demo/taslak)

on:
  workflow_dispatch:
    inputs:
      konu:
        description: "bilim/ altındaki klasör (içinde metin.txt olmalı)"
        required: true
      ses:
        description: "Piper Türkçe sesi (dfki)"
        required: false
        default: "dfki"
      hiz:
        description: "konuşma süresi çarpanı (1.0 normal, 0.9 daha hızlı)"
        required: false
        default: "0.95"

permissions:
  contents: write

jobs:
  seslendir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/piper
          key: whisper-large-v3-piper
      - name: Araçları kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q piper-tts faster-whisper
      - name: Seslendir ve yazıya dök
        run: |
          mkdir -p bilim/_log
          set -o pipefail
          K="${{ github.event.inputs.konu }}"
          rm -f "bilim/$K/kelimeler.json" bilim/$K/ses.*
          (python scripts/seslendir.py "$K" "${{ github.event.inputs.ses }}" "${{ github.event.inputs.hiz }}" && python scripts/transkript.py "$K") 2>&1 | tee bilim/_log/seslendir.log
      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add bilim || true
          git commit -m "Seslendirildi ve yazıya döküldü [skip ci]" || echo "Değişiklik yok"
          git pull --rebase && git push

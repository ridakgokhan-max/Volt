name: Görsel varlık üret

on:
  push:
    branches: [main]
    paths:
      - "assets/jobs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gen-assets
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yer aç
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sdxl-lightning-v1
      - name: Paketleri kur
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors peft
      - name: Değişen işleri çalıştır
        run: |
          mkdir -p out/assets
          for f in $(git diff --name-only HEAD~1 HEAD -- assets/jobs/ | grep '\.json$'); do
            [ -f "$f" ] || continue
            n=$(basename "$f" .json)
            mkdir -p out/assets/$n
            echo "== $f"
            python scripts/gen_assets.py "$f" 2>&1 | grep -v Warning | tail -n 40 | tee out/assets/$n/log.txt
          done
      - name: Sonucu depoya kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add out/assets
          git commit -m "Varlık üretimi sonucu [skip ci]" || echo "Değişiklik yok"
          git pull --rebase -q && git push

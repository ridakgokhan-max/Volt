name: Bilim - sahne görselleri üret

# bilim/<konu>/gorseller.json -> public/bilim/<konu>/<ad>.jpg (SDXL-Lightning + parşömen)
on:
  workflow_dispatch:
    inputs:
      konu:
        description: "bilim/ altındaki klasör"
        required: true

permissions:
  contents: write

jobs:
  gorsel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yer aç
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sdxl-lightning-v1
      - name: Paketleri kur
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q diffusers transformers accelerate safetensors peft numpy pillow
      - name: Görselleri üret
        run: |
          mkdir -p bilim/_log
          set -o pipefail
          python scripts/bilim_gorsel.py "${{ github.event.inputs.konu }}" 2>&1 | grep -v Warning | tail -n 60 | tee bilim/_log/gorsel.log
      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "volt-render-bot"
          git config user.email "volt-render-bot@users.noreply.github.com"
          git add public/bilim bilim/_log/gorsel.log || true
          git commit -m "Sahne görselleri üretildi [skip ci]" || echo "Değişiklik yok"
          git pull --rebase -q && git push
